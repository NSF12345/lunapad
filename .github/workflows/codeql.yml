# GitHub's code scanning (free for public repos): security issues in the Python
# code and in these workflows. Results appear under Security -> Code scanning.
name: CodeQL

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly, for newly added queries
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
