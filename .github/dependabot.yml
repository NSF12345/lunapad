# The workflow actions are pinned to exact commits (a tag like v4 can be moved by
# whoever controls the action). Dependabot opens a PR into beta when they update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    groups:
      # CodeQL's init and analyze steps must be the same version: update them together
      codeql:
        patterns:
          - "github/codeql-action*"
